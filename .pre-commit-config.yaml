repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: commit-body-format
        name: Commit body bullet format
        language: script
        entry: scripts/check-commit-body.sh
        stages: [commit-msg]

      # Patterns and the allow-list live in this repo's git config and .gitallowed,
      # so the scan uses the same rules whether pre-commit or git invokes it.
      - id: git-secrets
        name: Secret scan
        language: system
        entry: git secrets --pre_commit_hook --
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, test, chore, perf, ci, build, revert]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
