name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Check type baseline
        run: |
          error_count=$(mypy src/ 2>&1 | grep -c "error:" || true)
          baseline=$(head -1 .type_baseline)
          echo "mypy errors: $error_count (baseline: $baseline)"
          if [ "$error_count" -gt "$baseline" ]; then
            echo "Type errors increased from $baseline to $error_count"
            mypy src/
            exit 1
          fi
