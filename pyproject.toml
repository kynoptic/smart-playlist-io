[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-playlist-io"
version = "1.1.2"
description = "Encode and decode Apple Music Smart Playlist binary format (Smart Info + Smart Criteria)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "kynoptic" }]
keywords = ["apple-music", "itunes", "playlist", "smart-playlist", "binary"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
"Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kynoptic/smart-playlist-io"
Source = "https://github.com/kynoptic/smart-playlist-io"
"Bug Tracker" = "https://github.com/kynoptic/smart-playlist-io/issues"

[project.scripts]
decode-smart-playlists = "smart_playlist_io.decode:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0",
    "mypy>=1.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Unit tests for isolated components",
]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
    "--cov=smart_playlist_io",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["test_encode", "test_decode", "regenerate"]
disallow_untyped_defs = false
check_untyped_defs = false

[tool.coverage.run]
source = ["smart_playlist_io"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["smart_playlist_io"]
