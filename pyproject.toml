[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-playlist-io"
version = "1.0.0"
description = "Encode and decode Apple Music Smart Playlist binary format (Smart Info + Smart Criteria)"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.scripts]
decode-smart-playlists = "smart_playlist_io.decode:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Unit tests for isolated components",
]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
